<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="swarm-logo-title swarm-logo-desc">
  <title id="swarm-logo-title">SWARM</title>
  <desc id="swarm-logo-desc">A cybernetic bee in neon gold and cyan inside a sharp hexagonal honeycomb border on a dark background.</desc>
  <defs>
    <clipPath id="hex-clip">
      <polygon points="256,30 451.7,143 451.7,369 256,482 60.3,369 60.3,143"/>
    </clipPath>
    <clipPath id="abdomen-clip">
      <ellipse cx="256" cy="318" rx="60" ry="82"/>
    </clipPath>
    <pattern id="honeycomb" width="52" height="90" patternUnits="userSpaceOnUse" patternTransform="translate(8 6)">
      <g fill="none" stroke="#19e6ff" stroke-opacity="0.14" stroke-width="1.5">
        <polygon points="26,0 52,15 52,45 26,60 0,45 0,15"/>
        <polygon points="52,45 78,60 78,90 52,105 26,90 26,60"/>
        <polygon points="0,45 26,60 26,90 0,105 -26,90 -26,60"/>
      </g>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.55" stop-color="#f5c518"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="hex-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.5" stop-color="#f5c518"/>
      <stop offset="1" stop-color="#19e6ff"/>
    </linearGradient>
    <radialGradient id="wing" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#b9f6ff" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#19e6ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#19e6ff" stop-opacity="0.15"/>
    </radialGradient>
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background and hexagonal honeycomb border -->
  <rect width="512" height="512" fill="#0b0f14"/>
  <polygon points="256,30 451.7,143 451.7,369 256,482 60.3,369 60.3,143" fill="#0e141b"/>
  <rect width="512" height="512" fill="url(#honeycomb)" clip-path="url(#hex-clip)"/>
  <polygon points="256,30 451.7,143 451.7,369 256,482 60.3,369 60.3,143" fill="none" stroke="url(#hex-stroke)" stroke-width="10" stroke-linejoin="miter" filter="url(#glow-gold)"/>
  <polygon points="256,54 430.9,155 430.9,357 256,458 81.1,357 81.1,155" fill="none" stroke="#19e6ff" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Wings -->
  <g filter="url(#glow-cyan)">
    <ellipse cx="178" cy="222" rx="78" ry="34" transform="rotate(-32 178 222)" fill="url(#wing)" stroke="#19e6ff" stroke-width="3"/>
    <ellipse cx="334" cy="222" rx="78" ry="34" transform="rotate(32 334 222)" fill="url(#wing)" stroke="#19e6ff" stroke-width="3"/>
    <g fill="none" stroke="#19e6ff" stroke-width="1.6" stroke-opacity="0.9">
      <path d="M224 206 L150 190 M222 216 L128 226 M226 226 L158 252"/>
      <path d="M288 206 L362 190 M290 216 L384 226 M286 226 L354 252"/>
    </g>
  </g>

  <!-- Legs -->
  <g fill="none" stroke="#f5c518" stroke-width="6" stroke-linecap="round">
    <path d="M214 262 L178 288 L166 318"/>
    <path d="M298 262 L334 288 L346 318"/>
    <path d="M206 300 L172 332 L170 362"/>
    <path d="M306 300 L340 332 L342 362"/>
  </g>

  <!-- Abdomen with stripes and circuit traces -->
  <ellipse cx="256" cy="318" rx="60" ry="82" fill="url(#gold)" filter="url(#glow-gold)"/>
  <g clip-path="url(#abdomen-clip)" fill="#0b0f14">
    <rect x="180" y="286" width="152" height="22"/>
    <rect x="180" y="328" width="152" height="22"/>
    <rect x="180" y="370" width="152" height="22"/>
  </g>
  <g clip-path="url(#abdomen-clip)" fill="none" stroke="#19e6ff" stroke-width="2.2" stroke-linecap="round">
    <path d="M256 290 L256 312 L240 328 L240 348"/>
    <path d="M272 332 L272 352 L256 368"/>
    <circle cx="240" cy="348" r="3.5" fill="#19e6ff"/>
    <circle cx="256" cy="368" r="3.5" fill="#19e6ff"/>
    <circle cx="272" cy="332" r="3.5" fill="#19e6ff"/>
  </g>
  <!-- Stinger -->
  <polygon points="248,394 264,394 256,424" fill="#19e6ff" filter="url(#glow-cyan)"/>

  <!-- Thorax -->
  <ellipse cx="256" cy="226" rx="50" ry="42" fill="url(#gold)"/>
  <path d="M212 226 Q256 206 300 226" fill="none" stroke="#0b0f14" stroke-width="7" stroke-linecap="round"/>

  <!-- Head and visor -->
  <circle cx="256" cy="158" r="40" fill="url(#gold)"/>
  <rect x="222" y="148" width="68" height="18" rx="9" fill="#0b0f14"/>
  <rect x="228" y="152" width="24" height="10" rx="5" fill="#19e6ff" filter="url(#glow-cyan)"/>
  <rect x="260" y="152" width="24" height="10" rx="5" fill="#19e6ff" filter="url(#glow-cyan)"/>

  <!-- Antennae with circuit nodes -->
  <g fill="none" stroke="#f5c518" stroke-width="5" stroke-linecap="round">
    <path d="M238 124 L220 96 L198 84"/>
    <path d="M274 124 L292 96 L314 84"/>
  </g>
  <g fill="#19e6ff" filter="url(#glow-cyan)">
    <circle cx="198" cy="84" r="6"/>
    <circle cx="314" cy="84" r="6"/>
  </g>
</svg>
